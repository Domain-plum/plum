<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>plum.co.uk — this domain is for sale</title>
  <meta name="description" content="plum.co.uk is a short, memorable .co.uk domain available for direct purchase from its owner.">
  <meta name="robots" content="index, follow">

  <!-- Security: Content Security Policy (locked to same-origin, no external calls at all) -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self';
    img-src 'self';
    font-src 'self';
    connect-src 'none';
    frame-src 'none';
    object-src 'none';
    base-uri 'none';
    form-action 'none';
    frame-ancestors 'none';
    upgrade-insecure-requests;
  ">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>

  <div class="glow" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="hero">
    <svg class="ring" viewBox="0 0 600 600" aria-hidden="true">
      <circle cx="300" cy="300" r="260" />
      <circle cx="300" cy="300" r="2" class="ring__dot" />
    </svg>

    <div class="hero__top">
      <span class="tag">Domain</span>
      <span class="tag tag--muted">.co.uk</span>
      <span class="tag tag--muted">Owner sale</span>
    </div>

    <h1 class="wordmark">
      <span class="wordmark__line">PLUM</span>
      <span class="wordmark__tld">.CO.UK</span>
    </h1>

    <div class="hero__bottom">
      <p class="lede">Four letters. One clean word. Nothing to explain.<br>Held privately, sold directly — no agents, no listings, no auction clock.</p>

      <div class="cta-row">
        <a class="btn btn--primary" href="mailto:domain@plum.co.uk?subject=Offer%20for%20plum.co.uk">
          <span>Make an offer</span>
        </a>
        <button class="btn btn--ghost" id="copyEmailBtn" type="button" data-email="domain@plum.co.uk">
          <span id="copyEmailLabel">domain@plum.co.uk</span>
        </button>
      </div>
      <p class="copy-hint" id="copyHint" role="status" aria-live="polite">&nbsp;</p>
    </div>
  </main>

  <footer class="site-footer">
    <span>© 2026 plum.co.uk</span>
    <span>Privately owned · sold directly by its owner</span>
    <a href="mailto:domain@plum.co.uk">domain@plum.co.uk</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
